<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Quillnote{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/"><i></i>Quillnote</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/docs">API docs</a>
      {% if current_user and current_user.role == 'admin' %}
        <a class="btn btn-sm" href="/admin">Open admin panel</a>
      {% else %}
        <a href="/admin/login">Log in</a>
        <a class="btn btn-sm" href="/register">Create account</a>
      {% endif %}
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer"><div class="wrap"><span>Quillnote, a blog built with FastAPI and MongoDB Atlas.</span><a href="/docs">Read the API documentation</a></div></footer>
</body>
</html>
